$schema: https://moonrepo.dev/schemas/project.json

id: app
layer: library
language: javascript

tasks:
  build:
    # Runs bash rather than node on purpose. The task only has to produce a
    # cacheable output; using the pinned node would make moon locate a
    # proto-managed binary that --no-actions never installs.
    command:
      - bash
      - ./build.sh
    # `inputs` must never match pnpm-lock.yaml. The lockfile changes between
    # cases by design, and an input change moves the hash on its own -- which
    # would look like the defect being absent.
    inputs:
      - src/**/*
    outputs:
      - dist
    # The node toolchain is what pulls the javascript dependency fingerprint
    # into the hash. Without it the manifest carries no dependencies block and
    # every measurement below is void.
    toolchains:
      - node
