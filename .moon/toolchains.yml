$schema: https://moonrepo.dev/schemas/v2/toolchains.json

# The defect spans two repositories. moon core holds the matcher that fails, but
# the manifest and lockfile parsing that feeds it lives in the JavaScript
# toolchain plugin, which is released on its own cadence. Pinning the moon CLI
# alone would leave half the defect surface free to move under a reader, so the
# plugin is pinned to an explicit release here.
javascript:
  plugin: https://github.com/moonrepo/plugins/releases/download/javascript_toolchain-v1.2.2/javascript_toolchain.wasm
  packageManager: pnpm

# node and pnpm each contribute a `version` entry to every task hash. Pinning
# them is what makes the hashes in README.md identical on every machine.
#
# The build task deliberately runs `bash`, not `node`, so moon never has to
# locate a proto-managed node binary. Pinning a version moon has not installed
# would otherwise fail the run outright, because every measured run passes
# --no-actions and therefore skips toolchain setup.
node:
  version: 22.22.3

pnpm:
  version: 10.30.0
