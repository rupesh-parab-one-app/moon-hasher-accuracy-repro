$schema: https://moonrepo.dev/schemas/workspace.json

# Held to the 2.5 line so a reader cannot attribute a result to a moon this was
# never measured against, while still admitting each new patch release. A
# maintainer testing a fix on a different line must widen this; see README.md.
#
# Single comparator only. The 2.5 line rejects every multi-comparator form,
# including both ">=2.5.0, <2.6" and ">=2.5.0 <2.6", while 2.4.6 accepted the
# comma form. That parser change is the second defect this repository
# reproduces; see repro-version-constraint.sh.
versionConstraint: "^2.5.0"

projects:
  - packages/*

vcs:
  defaultBranch: main
  # moon writes git hooks on every task run and cannot handle `.git` being a
  # file, which is what a worktree checkout has.
  sync: false

codeowners:
  sync: false
